worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;

  # Rate limit zones
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

  upstream api {
    server api:5000;
  }

  server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API proxy — single backend for all apps (Web, Mobile, Desktop)
    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-App-Type $http_x_app_type;
      proxy_set_header X-App-Role $http_x_app_role;
      # CORS handled by Fastify; also allow preflight
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-app-type, x-app-role, x-request-id" always;
        return 204;
      }
    }

    # Auth more strict
    location ~ ^/api/auth/(login|register|otp) {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
    }

    # Docs (swagger) — only expose in non-prod or via allowlist
    location /docs {
      proxy_pass http://api;
    }
    location /health {
      proxy_pass http://api/api/health;
    }

    # User Web — VÉLORA Fashion House
    location / {
      root /usr/share/nginx/html/user;
      try_files $uri $uri/ /index.html;
      # Cache static assets
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }
    }

    # Admin Web
    location /admin/ {
      alias /usr/share/nginx/html/admin/;
      try_files $uri $uri/ /admin/index.html;
    }

    # Vendor Web
    location /vendor/ {
      alias /usr/share/nginx/html/vendor/;
      try_files $uri $uri/ /vendor/index.html;
    }

    # Delivery Web
    location /delivery/ {
      alias /usr/share/nginx/html/delivery/;
      try_files $uri $uri/ /delivery/index.html;
    }
  }
}
