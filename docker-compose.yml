# OmniCommerce — Single Backend, Multiple Frontends (Dev + Prod via compose.prod override)
services:
  # ── Backend (Fastify :5000) — single source of truth for Web, Expo Mobile, Electron Desktop
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omni-api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=5000
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:-mvvOeou2U9Gs1xMFhXJNui1TIt79OYw1Jt2EvxfwzgtSH23OePzl4x/kJmSftMF72/DxCAWtEesawyarXneN6Q==}
      - JWT_EXPIRES=7d
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,exp://*,http://localhost:19006}
      - RATE_LIMIT_MAX=100
      - RATE_LIMIT_WINDOW=60000
      - DB_PROVIDER=${DB_PROVIDER:-file}
      - DATABASE_URL=${DATABASE_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
    volumes:
      - ./backend/src/data:/app/src/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - omni-network

  # ── Web Frontends (Vite) — dev mode with HMR
  web-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    container_name: omni-web-user
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_APP_NAME=VÉLORA User
    depends_on:
      api:
        condition: service_healthy
    networks:
      - omni-network
    profiles: ["web", "dev"]

  web-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: omni-web-admin
    ports:
      - "5174:5174"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - omni-network
    profiles: ["web", "dev"]

  web-vendor:
    build:
      context: ./frontend-vendor
      dockerfile: Dockerfile
    container_name: omni-web-vendor
    ports:
      - "5175:5175"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - omni-network
    profiles: ["web", "dev"]

  web-delivery:
    build:
      context: ./frontend-deliveryman
      dockerfile: Dockerfile
    container_name: omni-web-delivery
    ports:
      - "5176:5176"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - omni-network
    profiles: ["web", "dev"]

  # ── Postgres (optional, for prod when DB_PROVIDER=postgres)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omni-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omnicommerce
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omnicommerce"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - omni-network
    profiles: ["postgres"]

  # ── Nginx reverse proxy (prod) — serves web builds + proxies /api to backend
  nginx:
    image: nginx:alpine
    container_name: omni-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend-user/dist:/usr/share/nginx/html/user:ro
      - ./frontend-admin/dist:/usr/share/nginx/html/admin:ro
      - ./frontend-vendor/dist:/usr/share/nginx/html/vendor:ro
      - ./frontend-deliveryman/dist:/usr/share/nginx/html/delivery:ro
    depends_on:
      - api
    networks:
      - omni-network
    profiles: ["prod"]

volumes:
  postgres_data:

networks:
  omni-network:
    driver: bridge
